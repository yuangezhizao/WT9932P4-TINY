name: Build ESP-IDF project

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  ESP_IDF_TARGET: ESP32P4
  ARTIFACT_BOOTLOADER_BIN_PATH: build/bootloader/bootloader.bin
  ARTIFACT_PARTITION_TABLE_BIN_PATH: build/partition_table/partition-table.bin
  ARTIFACT_APP_BIN_PATH: build/WT9932P4-TINY.bin

jobs:
  build:
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        esp_idf_version:
          - v5.5.4
        experimental:
          - false
        include:
          - os: ubuntu-latest
            esp_idf_version: latest
            experimental: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📤 Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 📥 Fetch dependencies
        run: |
          python3 -V
          python3 fetch_repos.py --yes

      - name: 🛠️ Build ESP-IDF project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.esp_idf_version }}
          target: ${{ env.ESP_IDF_TARGET }}

      - name: 📏 Show size by idf.py
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.esp_idf_version }}
          target: ${{ env.ESP_IDF_TARGET }}
          command: |
            idf.py size
            idf.py size-components
            idf.py size-files

      - name: ℹ️ Show image-info by esptool
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.esp_idf_version }}
          target: ${{ env.ESP_IDF_TARGET }}
          command: |
            if python -m esptool image-info --help >/dev/null 2>&1; then
              python -m esptool image-info ${{ env.ARTIFACT_BOOTLOADER_BIN_PATH }}
              echo
              python -m esptool image-info ${{ env.ARTIFACT_APP_BIN_PATH }}
            else
              python -m esptool image_info ${{ env.ARTIFACT_BOOTLOADER_BIN_PATH }} --version 2
              echo
              python -m esptool image_info ${{ env.ARTIFACT_APP_BIN_PATH }} --version 2
            fi

      - name: 📦 Upload build artifacts (include binary images)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ESP_IDF_TARGET }}-build-artifacts_on-${{ matrix.os }}_with-esp-idf-${{ matrix.esp_idf_version }}
          path: |
            build
            # ${{ env.ARTIFACT_BOOTLOADER_BIN_PATH }}
            # ${{ env.ARTIFACT_PARTITION_TABLE_BIN_PATH }}
            # ${{ env.ARTIFACT_APP_BIN_PATH }}
